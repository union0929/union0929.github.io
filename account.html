<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 계정 — 유니온 인쇄출판</title>
<link rel="icon" href="favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="union-sb.js"></script>
<style>
  :root{
    --mint:#4ECBBA; --mint-deep:#2FA898; --mint-soft:#E8F7F4;
    --navy:#26333C; --navy2:#3A4B56;
    --ink:#1E2A32; --sub:#5E7078; --faint:#94A5AD;
    --line:#E1E8EA; --line2:#EEF3F4; --bg:#F7FAFA; --card:#FFFFFF;
    --gold:#B7791F; --red:#D96A6A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:0 18px 70px}
  a{color:var(--mint-deep)}

  header{padding:26px 0 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--mint);color:#fff;display:grid;place-items:center;font-weight:800;font-size:21px;box-shadow:0 4px 14px rgba(78,203,186,.35);text-decoration:none}
  .brand h1{font-size:17px;font-weight:800;color:var(--navy);line-height:1.2}
  .brand span{font-size:10.5px;font-weight:600;color:var(--mint-deep);letter-spacing:2px}
  nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  nav a{font-size:13px;font-weight:700;color:var(--sub);text-decoration:none;padding:7px 11px;border-radius:9px}
  nav a:hover{background:var(--mint-soft);color:var(--mint-deep)}
  nav a.on{background:var(--navy);color:#fff}

  .card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
  .card h2{font-size:21px;font-weight:800;color:var(--navy);letter-spacing:-.5px;margin-bottom:4px}
  .card h3{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .lead{color:var(--sub);font-size:13.5px;margin-bottom:18px}

  .tabs{display:flex;background:var(--line2);border-radius:12px;padding:4px;margin-bottom:20px}
  .tabs button{flex:1;border:none;background:none;padding:10px;border-radius:9px;font:inherit;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer}
  .tabs button.on{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(0,0,0,.06)}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--navy2);margin-bottom:6px}
  .req{color:var(--red)}
  input[type=text],input[type=email],input[type=password],input[type=tel]{
    width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
  input:focus{outline:none;border-color:var(--mint);box-shadow:0 0 0 3px rgba(78,203,186,.15)}
  input[readonly]{background:var(--line2);color:var(--sub)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  @media(max-width:520px){.grid2{grid-template-columns:1fr}}
  .hint{font-size:11.5px;color:var(--faint);margin-top:5px}

  .agree{display:flex;gap:9px;align-items:flex-start;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:12px 13px;margin:6px 0 16px;cursor:pointer;font-size:13px;color:var(--navy2);font-weight:600}
  .agree input{width:17px;height:17px;margin-top:2px;accent-color:var(--mint-deep);flex:none}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:11px;padding:13px 18px;font:inherit;font-size:14.5px;font-weight:800;cursor:pointer;text-decoration:none;transition:.15s}
  .btn.full{width:100%}
  .btn.navy{background:var(--navy);color:#fff}
  .btn.navy:hover{background:var(--mint-deep)}
  .btn.mint{background:var(--mint);color:#fff}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--sub);font-weight:700}
  .btn.ghost:hover{border-color:var(--mint);color:var(--mint-deep)}
  .btn.sm{padding:8px 12px;font-size:12.5px;border-radius:9px}
  .btn.danger{background:#fff;border:1.5px solid #F2D0D0;color:var(--red);font-weight:700}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .linkbtn{background:none;border:none;color:var(--mint-deep);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:underline}

  .msg{display:none;border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:14px;line-height:1.55}
  .msg.on{display:block}
  .msg.err{background:#FDECEC;color:#8A2F2F;border:1px solid #F5CFCF}
  .msg.ok{background:var(--mint-soft);color:#1E6E63;border:1px solid #C7ECE5}

  .hello{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .hello .nm{font-size:20px;font-weight:800;color:var(--navy)}
  .hello .org{font-size:13px;color:var(--sub)}
  .hello .sp{flex:1}

  .qitem{border:1.5px solid var(--line);border-radius:13px;padding:14px 15px;margin-bottom:10px;background:#fff}
  .qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .qtitle{font-size:15px;font-weight:800;color:var(--navy);flex:1;min-width:0}
  .badge{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .st-draft{background:#EEF1F3;color:#5E7078}
  .st-requested{background:#FBEED6;color:#9A6414}
  .st-confirmed{background:#E1F0FF;color:#2362A8}
  .st-producing{background:#EDE7FB;color:#5B3FA8}
  .st-delivered{background:var(--mint-soft);color:#1E6E63}
  .st-canceled{background:#F4F4F4;color:#9AA5AB;text-decoration:line-through}
  .qmeta{font-size:12px;color:var(--faint);margin-top:3px}
  .qspec{font-size:12.5px;color:var(--sub);margin-top:7px;white-space:pre-wrap}
  .qamt{margin-top:9px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .qamt b{font-size:17px;color:var(--navy)}
  .qamt .k{font-size:12px;color:var(--faint);font-weight:700}
  .qamt .n{font-size:11.5px;color:var(--faint)}
  .qnote{margin-top:9px;background:#FFF8EC;border:1px solid #F3E2BF;border-radius:9px;padding:9px 11px;font-size:12.5px;color:#7A5712;white-space:pre-wrap}
  .qact{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
  .empty{text-align:center;color:var(--faint);font-size:13.5px;padding:28px 10px}
  .loading{text-align:center;color:var(--faint);padding:50px 0;font-size:14px}

  footer{margin-top:28px;text-align:center;font-size:12px;color:var(--faint);line-height:1.8}
  footer a{color:var(--sub)}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="index.html">U</a>
    <div class="brand"><h1>유니온 인쇄출판</h1><span>UNION PRINTING</span></div>
    <nav>
      <a href="index.html">홈</a>
      <a href="union_form.html">제작 문의</a>
      <a href="account.html" class="on">내 계정</a>
    </nav>
  </header>

  <div id="loadingView" class="loading">불러오는 중…</div>

  <!-- ══ 로그인 / 회원가입 ══ -->
  <div id="authView" class="hide">
    <div class="card">
      <h2 id="authTitle">로그인</h2>
      <p class="lead">회원이 되면 견적과 주문 진행 상황을 언제든 확인할 수 있어요.</p>
      <div class="tabs">
        <button id="tabLogin" class="on" onclick="showTab('login')">로그인</button>
        <button id="tabSignup" onclick="showTab('signup')">회원가입</button>
      </div>
      <div id="authMsg" class="msg"></div>

      <!-- 로그인 -->
      <div id="loginBox">
        <div class="field"><label>이메일</label><input type="email" id="liEmail" autocomplete="email" placeholder="example@school.go.kr"></div>
        <div class="field"><label>비밀번호</label><input type="password" id="liPw" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
        <button class="btn navy full" id="liBtn" onclick="doLogin()">로그인</button>
        <div style="text-align:center;margin-top:12px"><button class="linkbtn" onclick="showTab('reset')">비밀번호를 잊으셨나요?</button></div>
      </div>

      <!-- 회원가입 -->
      <div id="signupBox" class="hide">
        <div class="field"><label>이메일 <span class="req">*</span></label><input type="email" id="suEmail" autocomplete="email" placeholder="견적 안내를 받을 이메일"></div>
        <div class="grid2">
          <div class="field"><label>비밀번호 <span class="req">*</span></label><input type="password" id="suPw" autocomplete="new-password" placeholder="8자 이상"></div>
          <div class="field"><label>비밀번호 확인 <span class="req">*</span></label><input type="password" id="suPw2" autocomplete="new-password"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>담당자명 <span class="req">*</span></label><input type="text" id="suName" autocomplete="name"></div>
          <div class="field"><label>연락처 <span class="req">*</span></label><input type="tel" id="suPhone" inputmode="numeric" placeholder="010-0000-0000" oninput="UNION.autoHyphen(this)"></div>
        </div>
        <div class="field"><label>기관·회사명</label><input type="text" id="suOrg" autocomplete="organization" placeholder="예: 청주시청 총무과 (선택)"></div>
        <label class="agree"><input type="checkbox" id="suAgree">
          <span>(필수) <a href="privacy.html" target="_blank">개인정보 수집·이용</a>에 동의합니다.<br>
          <span style="font-weight:400;color:var(--faint);font-size:12px">수집 항목: 이메일·담당자명·연락처·기관명 / 목적: 회원 관리, 견적·주문 안내 / 보유: 회원 탈퇴 시까지</span></span>
        </label>
        <button class="btn navy full" id="suBtn" onclick="doSignup()">가입하기</button>
      </div>

      <!-- 비밀번호 찾기 -->
      <div id="resetBox" class="hide">
        <p class="lead" style="margin-bottom:12px">가입한 이메일을 적으면 비밀번호를 새로 정하는 링크를 보내드려요.</p>
        <div class="field"><label>이메일</label><input type="email" id="rsEmail" autocomplete="email"></div>
        <button class="btn navy full" id="rsBtn" onclick="doReset()">재설정 메일 보내기</button>
        <div style="text-align:center;margin-top:12px"><button class="linkbtn" onclick="showTab('login')">← 로그인으로</button></div>
      </div>
    </div>
  </div>

  <!-- ══ 새 비밀번호 정하기 (메일 링크로 들어온 경우) ══ -->
  <div id="recoverView" class="hide">
    <div class="card">
      <h2>새 비밀번호 정하기</h2>
      <p class="lead">앞으로 사용할 비밀번호를 입력해 주세요.</p>
      <div id="rcMsg" class="msg"></div>
      <div class="field"><label>새 비밀번호</label><input type="password" id="rcPw" autocomplete="new-password" placeholder="8자 이상"></div>
      <div class="field"><label>새 비밀번호 확인</label><input type="password" id="rcPw2" autocomplete="new-password"></div>
      <button class="btn navy full" id="rcBtn" onclick="doRecover()">비밀번호 변경</button>
    </div>
  </div>

  <!-- ══ 내 계정 ══ -->
  <div id="accountView" class="hide">
    <div class="card">
      <div class="hello">
        <div><div class="nm" id="helloName"></div><div class="org" id="helloOrg"></div></div>
        <span class="sp"></span>
        <button class="btn ghost sm" onclick="doLogout()">로그아웃</button>
      </div>
    </div>

    <div class="card">
      <h3>📋 내 견적·주문</h3>
      <div id="accMsg" class="msg"></div>
      <div id="quoteList"><div class="empty">불러오는 중…</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
        <a class="btn mint sm" href="quote.html" id="newQuoteBtn">＋ 즉시 견적 내기</a>
        <a class="btn ghost sm" href="union_form.html">제작 문의하기</a>
      </div>
    </div>

    <div class="card">
      <h3>👤 내 정보</h3>
      <div id="pfMsg" class="msg"></div>
      <div class="field"><label>이메일</label><input type="email" id="pfEmail" readonly></div>
      <div class="grid2">
        <div class="field"><label>담당자명</label><input type="text" id="pfName"></div>
        <div class="field"><label>연락처</label><input type="tel" id="pfPhone" inputmode="numeric" oninput="UNION.autoHyphen(this)"></div>
      </div>
      <div class="field"><label>기관·회사명</label><input type="text" id="pfOrg"></div>
      <button class="btn navy sm" id="pfBtn" onclick="saveProfile()">정보 저장</button>
    </div>

    <div style="text-align:center;margin-top:6px">
      <button class="linkbtn" style="color:var(--faint);font-weight:600" onclick="doWithdraw()">회원 탈퇴</button>
    </div>
  </div>

  <footer>
    유니온 인쇄출판 · ☎ <a href="tel:0432730929">043-273-0929</a> · union0929@daum.net<br>
    <a href="privacy.html">개인정보처리방침</a>
  </footer>
</div>

<script>
const U = window.UNION || {};
const $ = id => document.getElementById(id);
let recovering = false;

function show(view){
  ['loadingView','authView','recoverView','accountView'].forEach(v=>$(v).classList.toggle('hide', v!==view));
  window.scrollTo(0,0);
}
function msg(boxId, text, kind){
  const b=$(boxId); if(!b) return;
  if(!text){ b.className='msg'; b.textContent=''; return; }
  b.className='msg on '+(kind||'err'); b.textContent=text;
}
function busy(btnId, on, label){
  const b=$(btnId); if(!b) return;
  if(on){ b.dataset.t=b.textContent; b.textContent=label||'처리 중…'; b.disabled=true; }
  else { b.textContent=b.dataset.t||b.textContent; b.disabled=false; }
}

/* ── 탭 ── */
function showTab(t){
  $('loginBox').classList.toggle('hide', t!=='login');
  $('signupBox').classList.toggle('hide', t!=='signup');
  $('resetBox').classList.toggle('hide', t!=='reset');
  $('tabLogin').classList.toggle('on', t==='login');
  $('tabSignup').classList.toggle('on', t==='signup');
  $('authTitle').textContent = t==='signup'?'회원가입':(t==='reset'?'비밀번호 찾기':'로그인');
  msg('authMsg','');
}

/* ── 로그인 ── */
async function doLogin(){
  const email=$('liEmail').value.trim(), pw=$('liPw').value;
  if(!email||!pw){ msg('authMsg','이메일과 비밀번호를 입력해 주세요.'); return; }
  busy('liBtn',true,'로그인 중…');
  const { error } = await U.sb.auth.signInWithPassword({ email, password:pw });
  busy('liBtn',false);
  if(error){ msg('authMsg', U.krError(error)); return; }
  $('liPw').value='';
  await enterAccount();
}

/* ── 회원가입 ── */
async function doSignup(){
  const email=$('suEmail').value.trim(), pw=$('suPw').value, pw2=$('suPw2').value;
  const name=$('suName').value.trim(), phone=$('suPhone').value.trim(), org=$('suOrg').value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return msg('authMsg','이메일 주소를 확인해 주세요.');
  if(pw.length<8) return msg('authMsg','비밀번호는 8자 이상으로 정해 주세요.');
  if(pw!==pw2) return msg('authMsg','비밀번호 확인이 일치하지 않아요.');
  if(!name) return msg('authMsg','담당자명을 입력해 주세요.');
  const digits=phone.replace(/[^\d]/g,'');
  if(digits.length<9||digits.length>11) return msg('authMsg','연락처를 정확히 입력해 주세요. (예: 010-1234-5678)');
  if(!$('suAgree').checked) return msg('authMsg','개인정보 수집·이용에 동의해 주세요.');

  busy('suBtn',true,'가입 중…');
  const { data, error } = await U.sb.auth.signUp({
    email, password:pw,
    options:{
      data:{ name, org, phone, privacy_agree:'true' },
      emailRedirectTo: location.origin + location.pathname
    }
  });
  busy('suBtn',false);
  if(error) return msg('authMsg', U.krError(error));

  // 확인 메일 설정이 켜져 있을 때 이미 가입된 이메일이면 identities가 비어서 옴
  if(data && data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
    return msg('authMsg','이미 가입된 이메일이에요. 로그인해 주세요.');
  }
  if(data && data.session){ await enterAccount(true); return; }
  showTab('login');
  $('liEmail').value=email;
  msg('authMsg', `${email} 으로 가입 확인 메일을 보냈어요.\n메일의 링크를 누른 뒤 로그인해 주세요.`, 'ok');
}

/* ── 비밀번호 찾기 ── */
async function doReset(){
  const email=$('rsEmail').value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return msg('authMsg','이메일 주소를 확인해 주세요.');
  busy('rsBtn',true,'보내는 중…');
  const { error } = await U.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  busy('rsBtn',false);
  if(error) return msg('authMsg', U.krError(error));
  msg('authMsg','가입된 이메일이면 재설정 링크가 도착할 거예요. 메일함(스팸함 포함)을 확인해 주세요.','ok');
}
async function doRecover(){
  const pw=$('rcPw').value, pw2=$('rcPw2').value;
  if(pw.length<8) return msg('rcMsg','비밀번호는 8자 이상으로 정해 주세요.');
  if(pw!==pw2) return msg('rcMsg','비밀번호 확인이 일치하지 않아요.');
  busy('rcBtn',true,'변경 중…');
  const { error } = await U.sb.auth.updateUser({ password:pw });
  busy('rcBtn',false);
  if(error) return msg('rcMsg', U.krError(error));
  recovering=false;
  history.replaceState(null,'',location.pathname);
  await enterAccount();
  msg('accMsg','비밀번호를 변경했어요.','ok');
}

/* ── 로그아웃 ── */
async function doLogout(){
  await U.sb.auth.signOut();
  show('authView'); showTab('login');
}

/* ── 내 계정 화면 ── */
async function enterAccount(justJoined){
  show('accountView');
  let p=null;
  try{ p=await U.getProfile(); }catch(e){ msg('accMsg', U.krError(e)); }
  const u=await U.getUser();
  $('helloName').textContent=((p&&p.name)||'고객')+'님, 반가워요'+(justJoined?' 🎉':'');
  $('helloOrg').textContent=(p&&p.org)||'';
  $('pfEmail').value=(u&&u.email)||'';
  $('pfName').value=(p&&p.name)||'';
  $('pfPhone').value=(p&&p.phone)||'';
  $('pfOrg').value=(p&&p.org)||'';
  if(justJoined) msg('accMsg','가입이 완료됐어요. 이제 견적을 저장하고 주문 진행 상황을 여기서 확인할 수 있어요.','ok');
  await loadQuotes();
}

async function loadQuotes(){
  const box=$('quoteList');
  const { data, error } = await U.sb.from('quotes')
    .select('id,quote_no,product,title,spec,qty,est_amount,final_amount,status,customer_note,admin_note,created_at')
    .order('created_at',{ ascending:false });
  if(error){ box.innerHTML=''; msg('accMsg', U.krError(error)); return; }
  if(!data || !data.length){
    box.innerHTML='<div class="empty">아직 저장한 견적이 없어요.<br>아래 [즉시 견적 내기]로 바로 금액을 확인해 보세요.</div>';
    return;
  }
  box.innerHTML=data.map(q=>{
    const st=U.STATUS[q.status]||{label:q.status,cls:''};
    const summary=(q.spec&&q.spec.summary)?q.spec.summary:'';
    let amt='';
    if(q.final_amount!=null){
      amt=`<span class="k">확정 금액</span><b>${U.won(q.final_amount)}원</b><span class="n">VAT 포함</span>`;
    }else if(q.est_amount!=null){
      amt=`<span class="k">예상 금액</span><b>${U.won(q.est_amount)}원</b><span class="n">최종 금액은 담당자 확인 후 안내드려요</span>`;
    }
    let act='';
    if(q.status==='draft'){
      act=`<button class="btn navy sm" onclick="setStatus('${q.id}','requested')">주문 요청하기</button>
           <button class="btn danger sm" onclick="delQuote('${q.id}')">삭제</button>`;
    }else if(q.status==='requested'){
      act=`<button class="btn ghost sm" onclick="setStatus('${q.id}','canceled')">요청 취소</button>`;
    }
    return `<div class="qitem">
      <div class="qtop">
        <span class="qtitle">${U.esc(q.title||U.PRODUCT[q.product]||'견적')}</span>
        <span class="badge ${st.cls}">${st.label}</span>
      </div>
      <div class="qmeta">${U.esc(q.quote_no||'')} · ${U.PRODUCT[q.product]||''} · ${U.fmtDate(q.created_at)}${q.qty?` · ${U.won(q.qty)}개`:''}</div>
      ${summary?`<div class="qspec">${U.esc(summary)}</div>`:''}
      ${amt?`<div class="qamt">${amt}</div>`:''}
      ${q.customer_note?`<div class="qspec">💬 ${U.esc(q.customer_note)}</div>`:''}
      ${q.admin_note?`<div class="qnote">📢 담당자 안내\n${U.esc(q.admin_note)}</div>`:''}
      ${act?`<div class="qact">${act}</div>`:''}
    </div>`;
  }).join('');
}

async function setStatus(id, status){
  const ask = status==='requested'
    ? '이 견적으로 주문을 요청할까요?\n담당자가 확인 후 최종 금액과 일정을 안내드려요.'
    : '주문 요청을 취소할까요?';
  if(!confirm(ask)) return;
  const { error } = await U.sb.from('quotes').update({ status }).eq('id', id);
  if(error) return msg('accMsg', U.krError(error));
  msg('accMsg', status==='requested'?'주문을 요청했어요. 담당자가 곧 연락드릴게요.':'주문 요청을 취소했어요.','ok');
  await loadQuotes();
}
async function delQuote(id){
  if(!confirm('이 견적을 삭제할까요?')) return;
  const { error } = await U.sb.from('quotes').delete().eq('id', id);
  if(error) return msg('accMsg', U.krError(error));
  await loadQuotes();
}

async function saveProfile(){
  const name=$('pfName').value.trim(), phone=$('pfPhone').value.trim(), org=$('pfOrg').value.trim();
  if(!name) return msg('pfMsg','담당자명을 입력해 주세요.');
  const d=phone.replace(/[^\d]/g,'');
  if(d.length<9||d.length>11) return msg('pfMsg','연락처를 정확히 입력해 주세요.');
  const u=await U.getUser(); if(!u) return doLogout();
  busy('pfBtn',true,'저장 중…');
  const { error } = await U.sb.from('profiles').update({ name, phone, org }).eq('id', u.id);
  busy('pfBtn',false);
  if(error) return msg('pfMsg', U.krError(error));
  $('helloName').textContent=name+'님, 반가워요';
  $('helloOrg').textContent=org;
  msg('pfMsg','저장했어요.','ok');
}

async function doWithdraw(){
  if(!confirm('회원 탈퇴를 하면 고객 정보와 견적 기록이 모두 삭제되고 되돌릴 수 없어요.\n계속할까요?')) return;
  const t=prompt('정말 탈퇴하시려면 아래 칸에 "탈퇴"라고 입력해 주세요.');
  if(t===null) return;
  if(t.trim()!=='탈퇴'){ alert('입력이 일치하지 않아 취소했어요.'); return; }
  const { error } = await U.sb.rpc('delete_my_account');
  if(error){ msg('accMsg', U.krError(error)); window.scrollTo(0,0); return; }
  await U.sb.auth.signOut();
  show('authView'); showTab('login');
  msg('authMsg','탈퇴가 완료됐어요. 그동안 이용해 주셔서 감사합니다.','ok');
}

/* ── 시작 ── */
(async function init(){
  if(!U.ready){
    $('loadingView').innerHTML='회원 기능을 불러오지 못했어요.<br>잠시 후 새로고침하거나 043-273-0929로 연락 주세요.';
    return;
  }
  U.sb.auth.onAuthStateChange((event)=>{
    if(event==='PASSWORD_RECOVERY'){ recovering=true; show('recoverView'); }
  });
  // 메일 링크(가입 확인·비밀번호 재설정)로 들어온 경우 처리 시간을 잠깐 줌
  const fromMail=/access_token|type=recovery|code=/.test(location.hash+location.search);
  if(fromMail) await new Promise(r=>setTimeout(r,600));
  if(recovering) return;
  const u=await U.getUser();
  if(u){ await enterAccount(); if(fromMail) history.replaceState(null,'',location.pathname); }
  else { show('authView'); showTab(new URLSearchParams(location.search).get('tab')==='signup'?'signup':'login'); }
})();
</script>
